<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What a Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="omg_organize_ASAP.css">
    <script type="module" src="hell.js"></script>
</head>
<body>
    <div class="image-container">
        <img src="fml/openscene.PNG" alt="openscene" class="background">
        <div class="intro-prompt show typing" id="intro-prompt">
            <span class="intro-prompt-text">click anywhere.</span>
            <span class="intro-prompt-subtext">like multiple times</span>
        </div>
        <div class="shoe-wrapper">
            <img src="fml/blackshoe.png" alt="blackshoe" class="shoe shoe-black">
            <img src="fml/redshoe.png" alt="redshoe" class="shoe shoe-red">
        </div>
        <div class="post-it" id="post-it-note">
            <span class="post-it-text">start game...?</span>
        </div>
        <div class="scene-fade" id="scene-fade"></div>
    </div>
</body>
</html>
